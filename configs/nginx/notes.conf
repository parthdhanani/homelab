server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Defense-in-depth: tunnel traffic (from cloudflared, 172.18.0.4) must carry the
    # CF Access JWT header. If ZT Access is ever removed/misconfigured in the CF dashboard,
    # the vault returns 403 instead of going public. Internal sources (uptime-kuma etc.) unaffected.
    set $tunnel_guard "";
    if ($remote_addr = "172.18.0.4") { set $tunnel_guard "t"; }
    if ($http_cf_access_jwt_assertion = "") { set $tunnel_guard "${tunnel_guard}n"; }
    if ($tunnel_guard = "tn") { return 403; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location ~ /\. { deny all; }
}
