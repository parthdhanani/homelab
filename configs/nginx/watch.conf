# watch.psidex.com → duel.service (host systemd, 172.18.0.1:8090)
#
# Private surface: this hostname already sits behind Cloudflare Access (verified —
# an unauthenticated request 302s to psidex.cloudflareaccess.com), so /list/* needs
# no app-level token. The token-gated /d/ path stays available here too so an email
# link and a browser session behave identically.
#
# NOTE: this file is bind-mounted into the nginx container as a single file, which
# pins the inode — an editor that writes a NEW inode leaves the container reading the
# old content. After changing this file, `docker restart cryptex-portfolio`; a plain
# `nginx -s reload` is not enough.
server {
    listen 80;
    server_name watch.psidex.com;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = / {
        return 302 /list/movies;
    }

    location / {
        proxy_pass http://172.18.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }
}
