# public.psidex.com → Tianji public status page
server {
    listen 80;
    server_name public.psidex.com;
    return 301 https://status.psidex.com/status/public$request_uri;
}

# portfolio.psidex.com → Shlink short link (SCORM demo)
server {
    listen 80;
    server_name portfolio.psidex.com;
    return 301 https://go.psidex.com/prt$request_uri;
}

server {
    listen 80;
    server_name psidex.com www.psidex.com _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (FIXED: CSP allows unpkg.com for Lucide icons)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com https://fonts.googleapis.com https://analytics.psidex.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.psidex.com; media-src 'self';" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Strategic caching by file type
    location ~* \.html?$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location ~* \.(css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|mp3|mp4)$ {
        expires 90d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(woff|woff2|ttf|eot|pdf)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }
}
