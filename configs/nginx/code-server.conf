# code.psidex.com → code-server (port 8084)
server {
    listen 80;
    server_name code.psidex.com;

    # Timeouts for WebSocket and long-running connections
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # Reverse proxy to code-server
    location / {
        # Docker gateway to reach host's code-server on port 8084
        proxy_pass http://172.18.0.1:8084;

        # Headers for proxying
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for streaming
        proxy_buffering off;
        proxy_request_buffering off;

        # WebSocket support
        proxy_cache off;
    }
}
