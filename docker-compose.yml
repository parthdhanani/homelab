# CRYPTEX Rebuild — Production hardened, rolling latest images
# Deploy: cd /opt/cryptex && docker compose up -d
# Security: cap_drop ALL, no-new-privileges, memory limits, log rotation

networks:
  cryptex_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      tag: "cryptex/{{.Name}}"
  security_opt:
    - no-new-privileges=true
  cap_drop:
    - ALL

# ─── INFRASTRUCTURE ─────────────────────────────────────────

services:
  # 1. PostgreSQL — Shared database (Moodle, n8n, TRAX LRS, Forgejo)
  postgres:
    <<: *defaults
    image: postgres:16-alpine
    container_name: cryptex-postgres
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.2
    shm_size: 256m
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    volumes:
      - /opt/cryptex/data/postgres:/var/lib/postgresql/data
      - /opt/cryptex/configs/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MOODLE_DB_USER: ${MOODLE_DB_USER}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      TRAXLRS_DB_USER: ${TRAXLRS_DB_USER}
      TRAXLRS_DB_PASSWORD: ${TRAXLRS_DB_PASSWORD}
      FORGEJO_DB_USER: ${FORGEJO_DB_USER}
      FORGEJO_DB_PASSWORD: ${FORGEJO_DB_PASSWORD}
      MINIFLUX_DB_USER: ${MINIFLUX_DB_USER:-miniflux_user}
      MINIFLUX_DB_PASSWORD: ${MINIFLUX_DB_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    command: >
      postgres
        -c shared_buffers=256MB
        -c max_connections=60
        -c effective_cache_size=512MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c wal_buffers=16MB
        -c checkpoint_completion_target=0.9
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 1b. PgBouncer — Connection pooler (transaction mode, sits in front of postgres)
  # All app services connect here on port 5432 — NOT directly to postgres
  # userlist.txt is generated by deploy.sh from .env before containers start
  pgbouncer:
    <<: *defaults
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: cryptex-pgbouncer
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.29
    cap_add: [CHOWN, SETUID, SETGID]
    volumes:
      - /opt/cryptex/configs/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - /opt/cryptex/configs/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis — Cache + queue (n8n queue, Moodle sessions)
  redis:
    <<: *defaults
    image: redis:8-alpine
    container_name: cryptex-redis
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.3
    cap_add: [CHOWN, SETUID, SETGID]
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    command: redis-server --maxmemory 200mb --maxmemory-policy volatile-lru --requirepass "${REDIS_PASSWORD}" --save 60 1 --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Cloudflared — Cloudflare Tunnel (outbound only)
  cloudflared:
    <<: *defaults
    image: cloudflare/cloudflared:2026.3.0
    container_name: cryptex-cloudflared
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.4
    command: tunnel --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      # cloudflared is distroless — use built-in 'tunnel ready' subcommand (hits /ready endpoint)
      test: ["CMD", "/usr/local/bin/cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 4. Tailscale — Installed natively on VPS host (not in Docker)
  #    Install: curl -fsSL https://tailscale.com/install.sh | sh
  #    Setup:   sudo tailscale up --hostname=cryptex-vps --advertise-routes=172.18.0.0/16 --accept-dns=false

  # 5. Docker Socket Proxy — Filtered Docker API for Dozzle/DIUN
  socket-proxy:
    <<: *defaults
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: cryptex-socket-proxy
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.28
    cap_add: [CHOWN, SETUID, SETGID]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      LOGS: 1
      EVENTS: 1
      VERSION: 1
      NETWORKS: 1
      VOLUMES: 1
      # POST enabled: n8n restarts containers; DELETE enabled: Dockhand image cleanup
      POST: 1
      DELETE: 1
      EXEC: 0
      SYSTEM: 1    # required for GET /system/df (storage monitor workflow)
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── OB1 MEMORY ENGINE ──────────────────────────────────────

  # pgvector — Dedicated postgres for ob1 semantic memory
  pgvector:
    <<: *defaults
    image: pgvector/pgvector:pg16
    container_name: cryptex-pgvector
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.51
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    volumes:
      - /opt/cryptex/data/pgvector:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ob1
      POSTGRES_USER: ob1
      POSTGRES_PASSWORD: ${OB1_DB_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ob1 -d ob1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ob1 — Semantic memory MCP server (fastembed + pgvector)
  ob1:
    <<: *defaults
    build: ./dockerfiles/ob1
    container_name: cryptex-ob1
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.52
    depends_on:
      pgvector:
        condition: service_healthy
    volumes:
      - /opt/cryptex/data/ob1-models:/root/.cache/fastembed
      - /opt/cryptex/data/pkm:/pkm:ro
    environment:
      DB_HOST: cryptex-pgvector
      DB_PORT: "5432"
      DB_NAME: ob1
      DB_USER: ob1
      DB_PASSWORD: ${OB1_DB_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "0.75"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  # ─── WEB SERVICES ──────────────────────────────────────────

  # 6. Portfolio — Static site (nginx)
  portfolio:
    <<: *defaults
    image: nginx:alpine
    container_name: cryptex-portfolio
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.10
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    volumes:
      - /opt/cryptex/configs/nginx/portfolio.conf:/etc/nginx/conf.d/portfolio.conf:ro
      - /opt/cryptex/configs/nginx/aquasoul.conf:/etc/nginx/conf.d/aquasoul.conf:ro
      - /opt/cryptex/configs/nginx/code-server.conf:/etc/nginx/conf.d/code-server.conf:ro
      - /opt/cryptex/configs/nginx/files.conf:/etc/nginx/conf.d/files.conf:ro
      - /opt/cryptex/data/portfolio:/usr/share/nginx/html:ro
      - /opt/cryptex/data/aquasoul:/srv/aquasoul:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    healthcheck:
      # Use 127.0.0.1 — read_only:true can break localhost DNS resolution in Alpine
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 7. Moodle — LMS (custom build from moodle.org source)
  # Update: change MOODLE_VERSION in dockerfiles/moodle.Dockerfile, rebuild
  moodle:
    <<: *defaults
    build:
      context: ./dockerfiles
      dockerfile: moodle.Dockerfile
    container_name: cryptex-moodle
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.7
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE, SYS_CHROOT]
    volumes:
      - /opt/cryptex/data/moodledata:/var/www/moodledata
      - /opt/cryptex/data/moodle-uploads:/moodle-uploads:ro
      - /opt/cryptex/data/moodle-plugins/theme:/var/www/html/theme
      - /opt/cryptex/data/moodle-plugins/format:/var/www/html/course/format
    environment:
      DB_HOST: cryptex-postgres
      DB_NAME: moodle
      DB_USER: ${MOODLE_DB_USER}
      DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      MOODLE_URL: https://learn.${DOMAIN}
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL}
      MOODLE_SITE_NAME: ${MOODLE_SITE_NAME}
      REDIS_HOST: cryptex-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_SECURITY: tls
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"
    healthcheck:
      # 303 redirects to external https://learn.DOMAIN — don't follow; accept 2xx/3xx
      test: ["CMD-SHELL", "curl -sSo /dev/null -w '%{http_code}' http://127.0.0.1:80/ | grep -qE '^[23]'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # 8. TRAX LRS — xAPI Learning Record Store
  traxlrs:
    <<: *defaults
    build:
      context: ./dockerfiles
      dockerfile: traxlrs.Dockerfile
    container_name: cryptex-traxlrs
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.13
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    volumes:
      - /opt/cryptex/data/traxlrs:/var/www/html/storage
    environment:
      APP_KEY: ${TRAXLRS_APP_KEY}
      APP_URL: https://lrs.${DOMAIN}
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: cryptex-pgbouncer
      DB_PORT: "5432"
      DB_DATABASE: traxlrs
      DB_USERNAME: ${TRAXLRS_DB_USER}
      DB_PASSWORD: ${TRAXLRS_DB_PASSWORD}
      ADMIN_EMAIL: ${TRAXLRS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${TRAXLRS_ADMIN_PASSWORD}
      DEFAULT_ENDPOINT_USERNAME: ${TRAXLRS_ENDPOINT_USERNAME:-traxlrs}
      DEFAULT_ENDPOINT_PASSWORD: ${TRAXLRS_ENDPOINT_PASSWORD}
    depends_on:
      pgbouncer:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      # --max-redirs 0 prevents following external redirect; -w checks status is 2xx or 3xx
      test: ["CMD-SHELL", "curl -sSo /dev/null -w '%{http_code}' http://127.0.0.1:80/ | grep -qE '^[23]'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 9. Vaultwarden — Password manager
  vaultwarden:
    <<: *defaults
    image: vaultwarden/server:1.36.0-alpine
    container_name: cryptex-vaultwarden
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.6
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    volumes:
      - /opt/cryptex/data/vaultwarden:/data
    environment:
      DOMAIN: https://vault.${DOMAIN}
      SIGNUPS_ALLOWED: "${VAULTWARDEN_SIGNUPS_ALLOWED:-false}"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      DATABASE_URL: /data/db.sqlite3
      WEBSOCKET_ENABLED: "true"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_SECURITY: starttls
      SMTP_FROM: ${SMTP_USER}
      SMTP_USERNAME: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      # PocketID SSO — fill in after creating 'vaultwarden' client in PocketID UI
      SSO_ENABLED: "${VAULTWARDEN_SSO_ENABLED:-false}"
      SSO_ONLY: "false"
      SSO_AUTHORITY: "https://id.${DOMAIN}"
      SSO_CLIENT_ID: "${POCKETID_VAULTWARDEN_CLIENT_ID:-}"
      SSO_CLIENT_SECRET: "${POCKETID_VAULTWARDEN_CLIENT_SECRET:-}"
      SSO_SCOPES: "openid,email,profile"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:80/alive"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 10. n8n — Workflow automation (regular mode, single-user)
  # n8n-tools: init container that installs qpdf + pdftotext into a shared volume.
  # Runs once on deploy; n8n mounts /tools and adds it to PATH.
  # This lets n8n use the official image (auto-updatable) without a custom Dockerfile.
  n8n-tools:
    image: alpine:3.22
    container_name: cryptex-n8n-tools
    restart: "no"
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.35
    volumes:
      - n8n_tools:/tools
    command:
      - sh
      - -c
      - |
        if [ ! -f /tools/usr/bin/qpdf ]; then
          echo 'Installing qpdf + pdftotext...'
          apk add --no-cache qpdf poppler-utils
          mkdir -p /tools/usr/bin /tools/usr/lib
          cp /usr/bin/qpdf /usr/bin/pdftotext /tools/usr/bin/
          cp -aP /usr/lib/. /tools/usr/lib/
          echo 'Tools ready.'
        else
          echo 'Tools already installed, skipping.'
        fi
    security_opt:
      - no-new-privileges=true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

  n8n:
    <<: *defaults
    image: n8nio/n8n:2.20.6
    container_name: cryptex-n8n
    user: "1000:1000"
    ports:
      - "127.0.0.1:5678:5678"
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.8
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    depends_on:
      n8n-tools:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /opt/cryptex/data/n8n:/home/node/.n8n
      - /opt/cryptex/configs/n8n-workflows:/opt/workflows:ro
      - /opt/cryptex/data/moodle-uploads:/moodle-uploads
      - n8n_tools:/tools:ro
      - /opt/cryptex/data/pkm:/pkm:ro
    environment:
      PATH: /tools/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /tools/usr/lib
      N8N_HOST: n8n.${DOMAIN}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      GENERIC_TIMEZONE: UTC
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: cryptex-pgbouncer
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Telegram Bot (used by n8n workflows for alerts + commands)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Gemini API (used by n8n maintenance workflows for update intelligence)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Miniflux (used by morning digest workflow)
      MINIFLUX_ADMIN_USER: ${MINIFLUX_ADMIN_USER:-admin}
      MINIFLUX_ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD:-}
      MINIFLUX_URL: http://cryptex-miniflux:8080
      # Bank statement automation (IMAP trigger + PDF processing)
      BANK_EMAIL_DOMAIN: ${BANK_EMAIL_DOMAIN:-}
      BANK_PDF_PASSWORD: ${BANK_PDF_PASSWORD:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: 600M
          cpus: "1.0"
    healthcheck:
      # 127.0.0.1 — localhost DNS fails in Alpine/BusyBox containers with no resolv.conf
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Woodpecker CI — Self-hosted CI/CD for Forgejo repos ─────────────────────
  woodpecker-server:
    <<: *defaults
    image: woodpeckerci/woodpecker-server:v3.14.0
    container_name: cryptex-woodpecker-server
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.50
    volumes:
      - /opt/cryptex/data/woodpecker:/var/lib/woodpecker
    environment:
      WOODPECKER_OPEN: "false"
      WOODPECKER_GITEA: "true"
      WOODPECKER_GITEA_URL: "https://git.${DOMAIN}"
      WOODPECKER_GITEA_CLIENT: "${WOODPECKER_FORGEJO_CLIENT_ID}"
      WOODPECKER_GITEA_SECRET: "${WOODPECKER_FORGEJO_CLIENT_SECRET}"
      WOODPECKER_AGENT_SECRET: "${WOODPECKER_AGENT_SECRET}"
      WOODPECKER_HOST: "https://ci.${DOMAIN}"
      WOODPECKER_DATABASE_DRIVER: "postgres"
      WOODPECKER_DATABASE_DATASOURCE: "postgres://${WOODPECKER_DB_USER}:${WOODPECKER_DB_PASSWORD}@cryptex-pgbouncer:5432/woodpecker?sslmode=disable"
    depends_on:
      pgbouncer:
        condition: service_healthy
      forgejo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    # No healthcheck — distroless image has no shell/wget/nc
    # Agent uses service_started so it doesn't wait on health status

  woodpecker-agent:
    <<: *defaults
    image: woodpeckerci/woodpecker-agent:v3.14.0
    container_name: cryptex-woodpecker-agent
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.49
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WOODPECKER_SERVER: "cryptex-woodpecker-server:9000"
      WOODPECKER_AGENT_SECRET: "${WOODPECKER_AGENT_SECRET}"
      WOODPECKER_MAX_WORKFLOWS: "2"
    security_opt:
      - no-new-privileges=false
    depends_on:
      woodpecker-server:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  # 13. AdGuard Home — DNS filtering
  # Port 53 exposed to host for Tailscale DNS routing
  adguard:
    <<: *defaults
    image: adguard/adguardhome:v0.107.74
    container_name: cryptex-adguard
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.12
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    ports:
      - "127.0.0.1:53:53/tcp"
      - "127.0.0.1:53:53/udp"
    volumes:
      - /opt/cryptex/data/adguard/work:/opt/adguardhome/work
      - /opt/cryptex/data/adguard/conf:/opt/adguardhome/conf
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.5"
    healthcheck:
      # DNS port check — stays up during filter updates unlike HTTP UI (which freezes on large lists)
      test: ["CMD-SHELL", "nc -z 127.0.0.1 53 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # 14. Kopia — Backup server (local repository, initialized by deploy.sh)
  kopia:
    <<: *defaults
    image: kopia/kopia:0.22.3
    container_name: cryptex-kopia
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.19
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    volumes:
      - /opt/cryptex/data/kopia/config:/app/config
      - /opt/cryptex/data/kopia/cache:/app/cache
      - /opt/cryptex/data/kopia/repository:/app/repository
      - /opt/cryptex/data:/data:ro
      - /opt/cryptex/backups:/backups:ro
    environment:
      KOPIA_CONFIG_PATH: /app/config/repository.config
      KOPIA_LOG_DIR: /app/config/logs
      KOPIA_CACHE_DIRECTORY: /app/cache
      KOPIA_PASSWORD: ${KOPIA_PASSWORD}
      KOPIA_SERVER_CONTROL_PASSWORD: ${KOPIA_SERVER_PASSWORD}
      KOPIA_SERVER_CONTROL_USERNAME: ${KOPIA_SERVER_USER}
      KOPIA_SERVER_USERNAME: ${KOPIA_SERVER_USER}
      KOPIA_SERVER_PASSWORD: ${KOPIA_SERVER_PASSWORD}
    command: server start --insecure --address=0.0.0.0:51515
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    healthcheck:
      # 401 = server up (unauthenticated probe confirms listener is ready)
      test: ["CMD-SHELL", "curl -so /dev/null -w '%{http_code}' http://127.0.0.1:51515/ | grep -q 401"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── UTILITIES ──────────────────────────────────────────────

  # 16. [REMOVED] DIUN — replaced by Dockhand

  # 17. [REMOVED] HolyClaude replaced by Zellij host install
  # Zellij runs as a systemd service on the host (not a container)
  # Service: /etc/systemd/system/zellij-web.service → port 8082
  # Tools: Claude Code + Gemini CLI + yazi + zoxide + starship + fzf + ripgrep + bat + fd
  # Auth: Zellij token (run: zellij web --create-token)
  # Config: /home/ubuntu/.config/zellij/
  # Zellaude plugin: /home/ubuntu/.config/zellij/plugins/zellaude.wasm
  # Access: code.psidex.com → Cloudflare Tunnel → localhost:8082
  # Update Zellij: wget new binary from github.com/zellij-org/zellij/releases → replace /usr/local/bin/zellij → sudo systemctl restart zellij-web
  # Update Claude Code: sudo npm update -g @anthropic-ai/claude-code
  # Update Gemini CLI: sudo npm update -g @google/gemini-cli

  # 18. [REMOVED] Dozzle — replaced by Dockhand

  # ── Dockhand — Docker management: logs + update notifications + vuln scan ──
  dockhand:
    <<: *defaults
    image: fnsys/dockhand@sha256:656ae5ed674d79b8251de275ae4259043f60222bbab563c71ed8dd91edd0b660  # no semver tags; pin digest, update manually
    container_name: cryptex-dockhand
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.40
    volumes:
      - /opt/cryptex/data/dockhand:/app/data
    environment:
      DOCKER_HOST: tcp://cryptex-socket-proxy:2375
    depends_on:
      socket-proxy:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Uptime Kuma — Uptime monitoring + status page ────────────────────────
  uptime-kuma:
    <<: *defaults
    image: louislam/uptime-kuma:2.3.2
    container_name: cryptex-uptime-kuma
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.41
    cap_add: [SETUID, SETGID, CHOWN]
    volumes:
      - /opt/cryptex/data/uptime-kuma:/app/data
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Umami — Web Analytics ────────────────────────────────────────────────
  umami:
    <<: *defaults
    image: ghcr.io/umami-software/umami@sha256:e3f80c0625aad7179b49da27d475357cabb1068b8cacd9a792cfd6966888b123  # no versioned tags; pin digest, update manually
    container_name: cryptex-umami
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.44
    environment:
      DATABASE_URL: "postgresql://${UMAMI_DB_USER}:${UMAMI_DB_PASSWORD}@cryptex-pgbouncer:5432/umami?pgbouncer=true&connection_limit=1"
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: "1"
    depends_on:
      pgbouncer:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Shlink — URL Shortener ───────────────────────────────────────────────
  shlink:
    <<: *defaults
    image: shlinkio/shlink:5.0.2
    container_name: cryptex-shlink
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.42
    environment:
      DEFAULT_DOMAIN: ${SHLINK_DOMAIN}
      IS_HTTPS_ENABLED: "true"
      DB_DRIVER: postgres
      DB_HOST: cryptex-postgres
      DB_PORT: 5432
      DB_NAME: shlink
      DB_USER: ${SHLINK_DB_USER}
      DB_PASSWORD: ${SHLINK_DB_PASSWORD}
      INITIAL_API_KEY: ${SHLINK_API_KEY}
      ANONYMIZE_REMOTE_ADDR: "false"
      TRACK_ORPHAN_VISITS: "true"
      TIMEZONE: UTC
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/rest/health | grep -q '\"status\":\"pass\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  shlink-web:
    <<: *defaults
    image: shlinkio/shlink-web-client:4.7.0
    container_name: cryptex-shlink-web
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.43
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.10"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 19. Forgejo — Self-hosted Git (Codeberg fork, no GitHub dependency)
  forgejo:
    <<: *defaults
    image: codeberg.org/forgejo/forgejo:15.0.1
    container_name: cryptex-forgejo
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.31
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, NET_BIND_SERVICE]
    volumes:
      - /opt/cryptex/data/forgejo:/data
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: cryptex-postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: ${FORGEJO_DB_USER}
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD}
      FORGEJO__server__ROOT_URL: https://git.${DOMAIN}/
      FORGEJO__server__DOMAIN: git.${DOMAIN}
      FORGEJO__server__SSH_DOMAIN: git.${DOMAIN}
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "${FORGEJO_DISABLE_REGISTRATION:-true}"
      FORGEJO__mailer__ENABLED: "true"
      FORGEJO__mailer__PROTOCOL: smtp+starttls
      FORGEJO__mailer__SMTP_ADDR: smtp.gmail.com
      FORGEJO__mailer__SMTP_PORT: "587"
      FORGEJO__mailer__USER: ${SMTP_USER}
      FORGEJO__mailer__PASSWD: ${SMTP_PASSWORD}
      FORGEJO__mailer__FROM: ${SMTP_USER}
      FORGEJO__packages__ENABLED: "true"
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY}
      # PocketID OIDC — after creating 'forgejo' client in PocketID UI, add auth source in
      # Forgejo admin: /-/admin/auths/new → OAuth2 → Discovery URL: https://id.psidex.com/.well-known/openid-configuration
      FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION: "false"
      FORGEJO__oauth2_client__OPENID_CONNECT_SCOPES: "openid email profile"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 20. Miniflux — RSS reader (reading UI + source for AI morning digest)
  # After deploy: add feeds via news.DOMAIN UI, then n8n digest runs automatically
  # Cleanup policy: read articles removed after 30d, unread after 60d (prevents Postgres bloat)
  miniflux:
    <<: *defaults
    image: miniflux/miniflux:2.2.19
    container_name: cryptex-miniflux
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.14
    cap_add: [CHOWN, SETUID, SETGID]
    environment:
      DATABASE_URL: "postgres://${MINIFLUX_DB_USER:-miniflux_user}:${MINIFLUX_DB_PASSWORD}@cryptex-postgres:5432/miniflux?sslmode=disable"
      RUN_MIGRATIONS: 1
      CREATE_ADMIN: 0
      ADMIN_USERNAME: ${MINIFLUX_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD}
      OAUTH2_PROVIDER: "oidc"
      OAUTH2_CLIENT_ID: "${POCKETID_MINIFLUX_CLIENT_ID:-}"
      OAUTH2_CLIENT_SECRET: "${POCKETID_MINIFLUX_CLIENT_SECRET:-}"
      OAUTH2_REDIRECT_URL: "https://news.${DOMAIN}/oauth2/oidc/callback"
      OAUTH2_OIDC_DISCOVERY_ENDPOINT: "https://id.${DOMAIN}"
      OAUTH2_USER_CREATION: "1"
      BASE_URL: https://news.${DOMAIN}
      CLEANUP_FREQUENCY_HOURS: 24
      CLEANUP_ARCHIVE_READ_DAYS: 30
      CLEANUP_ARCHIVE_UNREAD_DAYS: 60
      POLLING_FREQUENCY: 60
      POLLING_PARSING_ERROR_LIMIT: 3
      FETCH_YOUTUBE_WATCH_TIME: 0
      # PocketID OIDC — fill in after creating 'miniflux' client in PocketID UI, then set OAUTH2_PROVIDER=oidc
    depends_on:
      pgbouncer:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 22. ActualBudget — Self-hosted budget tracker (bank statement import via n8n)
  # Access at budget.DOMAIN — set up one budget file after first login
  # user 1001 = actual (image-defined) — required because cap_drop:ALL removes CAP_DAC_OVERRIDE,
  # so root can't write to dirs it doesn't own; running as actual avoids that entirely
  actualbudget:
    <<: *defaults
    image: actualbudget/actual-server:26.5.2
    container_name: cryptex-actualbudget
    user: "1001:1001"
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.17
    volumes:
      - /opt/cryptex/data/actualbudget:/data
    environment:
      ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB: 20
      ACTUAL_UPLOAD_SYNC_ENCRYPTION_KEY_SIZE: 16
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      # actualbudget has node but not wget — use node HTTP request
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5006/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── MongoDB — Native document store for LibreChat ────────────────────────────
  # FerretDB v1/v2 both lacked required findAndModify compatibility for LibreChat.
  # MongoDB Community ARM64 is the supported backend. Standalone, no replica set needed.
  ferretdb:
    <<: *defaults
    image: mongo:8
    container_name: cryptex-ferretdb
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE, DAC_READ_SEARCH]
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.45
    volumes:
      - /opt/cryptex/data/mongodb:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${FERRETDB_DB_USER}"
      MONGO_INITDB_ROOT_PASSWORD: "${FERRETDB_DB_PASSWORD}"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── LibreChat — AI chat interface (replaces OpenWebUI) ───────────────────────
  librechat:
    <<: *defaults
    image: ghcr.io/danny-avila/librechat:v0.8.5
    container_name: cryptex-librechat
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.46
    volumes:
      - /opt/cryptex/data/librechat/images:/app/client/public/images
      - /opt/cryptex/data/librechat/logs:/app/api/logs
      - /opt/cryptex/data/librechat/data:/app/api/data
      - /opt/cryptex/configs/librechat/librechat.yaml:/app/librechat.yaml:ro
    environment:
      HOST: "0.0.0.0"
      PORT: "3080"
      MONGO_URI: "mongodb://${FERRETDB_DB_USER}:${FERRETDB_DB_PASSWORD}@cryptex-ferretdb:27017/LibreChat?authSource=admin"
      DOMAIN_CLIENT: "https://chat.${DOMAIN}"
      DOMAIN_SERVER: "https://chat.${DOMAIN}"
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET}
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY}
      CREDS_IV: ${LIBRECHAT_CREDS_IV}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENROUTER_KEY: ${OPENROUTER_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY}
      ALLOW_REGISTRATION: "false"
      ALLOW_SOCIAL_LOGIN: "${LIBRECHAT_ALLOW_SOCIAL_LOGIN:-false}"
      ALLOW_PASSWORD_RESET: "false"
      SESSION_EXPIRY: "1000 * 60 * 60 * 24 * 7"
      SEARCH_ENABLED: "true"
      SEARXNG_URL: "http://cryptex-searxng:8080"
      REFRESH_TOKEN_EXPIRY: "(1000 * 60 * 60 * 24 * 7) * 2"
      # PocketID OIDC — fill in after creating 'librechat' client in PocketID UI
      OPENID_CLIENT_ID: "${POCKETID_LIBRECHAT_CLIENT_ID:-}"
      OPENID_CLIENT_SECRET: "${POCKETID_LIBRECHAT_CLIENT_SECRET:-}"
      OPENID_ISSUER: "https://id.${DOMAIN}"
      OPENID_SESSION_SECRET: "${POCKETID_LIBRECHAT_SESSION_SECRET:-}"
      OPENID_SCOPE: "openid email profile"
      OPENID_CALLBACK_URL: "/oauth/openid/callback"
      OPENID_BUTTON_LABEL: "Sign in with Cryptex ID"
    depends_on:
      ferretdb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── SearXNG — Private self-hosted search engine ───────────────────────────
  searxng:
    <<: *defaults
    image: searxng/searxng:2026.5.9-849e17e43
    container_name: cryptex-searxng
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.32
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges=true
    volumes:
      - /opt/cryptex/data/searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: https://search.${DOMAIN}
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── [REMOVED] rclone — WebDAV abandoned (CF blocks PROPFIND)

  # ── Alist — Cloud storage aggregator (WebDAV endpoint for all drives) ─────
  alist:
    <<: *defaults
    image: xhofe/alist:v3.60.0
    container_name: cryptex-alist
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.39
    cap_add: [CHOWN, SETUID, SETGID]
    volumes:
      - /opt/cryptex/data/alist:/opt/alist/data
      - /opt/cryptex/data/pkm:/mnt/pkm:ro
      - /opt/cryptex/data/portfolio:/mnt/portfolio:ro
      - /opt/cryptex/data/aquasoul:/mnt/aquasoul:ro
      - /opt/cryptex/data/moodle-uploads:/mnt/moodle-uploads:ro
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:5244/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Stirling PDF — Self-hosted PDF tools ─────────────────────────────────
  stirling-pdf:
    <<: *defaults
    image: frooodle/s-pdf:2.10.1
    container_name: cryptex-stirling-pdf
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.33
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges=false
    volumes:
      - /opt/cryptex/data/stirling-pdf/trainingData:/usr/share/tesseract-ocr/5/tessdata
      - /opt/cryptex/data/stirling-pdf/configs:/configs
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      SECURITY_ENABLE_LOGIN: "false"
      INSTALL_BOOK_AND_ADVANCED_HTML_OPS: "false"
      STIRLING_JVM_PROFILE: "balanced"
      # Override balanced profile to strip heap dump generation — keeps ExitOnOutOfMemoryError
      # for clean Docker restarts but stops 3.9GB of .hprof accumulation
      _JVM_OPTS_BALANCED: >-
        -XX:+ExitOnOutOfMemoryError
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:G1HeapRegionSize=4m
        -XX:G1PeriodicGCInterval=60000
        -XX:+UseStringDeduplication
        -XX:+ExplicitGCInvokesConcurrent
        -Dspring.threads.virtual.enabled=true
        -Djava.awt.headless=true
      # Heap sizing — 2G limit, 65% = ~1.3G heap for large PDF operations
      JAVA_TOOL_OPTIONS: >-
        -XX:InitialRAMPercentage=10
        -XX:MaxRAMPercentage=65
        -XX:MaxMetaspaceSize=256m
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '%{http_code}' http://127.0.0.1:8080/ | grep -qE '^[234]|401'"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s

  # ── IT-Tools — Developer utility collection ──────────────────────────────
  it-tools:
    <<: *defaults
    image: corentinth/it-tools:latest  # tags use YYYY.MM.DD-<githash> format; Dockhand monitors
    container_name: cryptex-it-tools
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.36
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Notes — MkDocs Material static site (Obsidian vault → HTML, built via cron) ──
  # Build runs every 15min: /opt/cryptex/scripts/notes-build.sh
  # Manual rebuild: bash /opt/cryptex/scripts/notes-build.sh --force
  # Vault source: /opt/cryptex/data/pkm
  notes:
    <<: *defaults
    image: nginx:alpine
    container_name: cryptex-notes
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.37
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    volumes:
      - /opt/cryptex/data/notes-output:/usr/share/nginx/html:ro
      - /opt/cryptex/configs/nginx/notes.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.10"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/health 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── [REMOVED] quartz-builder — cron-only pattern is correct (see /opt/cryptex/scripts/quartz-build.sh)

  # ── PocketID — OIDC identity provider (SSO for Forgejo, LibreChat, Vaultwarden, Miniflux, Moodle)
  # After first deploy: visit https://id.DOMAIN to create admin account, then create OIDC clients
  # for each service and fill in POCKETID_* vars in .env, then `docker compose up -d`
  pocketid:
    <<: *defaults
    image: ghcr.io/pocket-id/pocket-id:v2.6.2
    container_name: cryptex-pocketid
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.47
    cap_add: [CHOWN, SETUID, SETGID]
    volumes:
      - /opt/cryptex/data/pocketid:/app/data
    environment:
      APP_URL: https://id.${DOMAIN}
      TRUST_PROXY: "true"
      APP_NAME: "Cryptex"
      MAXMIND_LICENSE_KEY: ""
      ENCRYPTION_KEY: ${POCKETID_ENCRYPTION_KEY}
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:1411/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  redis_data:
  n8n_tools:
