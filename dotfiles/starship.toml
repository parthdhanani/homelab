# --- Starship: No Runtimes Preset (Corrected) ---
# Explicitly defining the format order
format = """
$time\
$directory\
$git_branch\
$git_status\
$status\
$character"""

[directory]
style = "bold blue"

[git_branch]
style = "bold green"
symbol = " "

[git_status]
style = "bold yellow"

[status]
style = "bold red"
symbol = "🎯"
disabled = false

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# Corrected time module format
[time]
disabled = false
format = '[$time](grey) '
time_format = "%R"

# Disable all runtime modules for maximum speed
[package]
disabled = true
[nodejs]
disabled = true
[rust]
disabled = true
[python]
disabled = true
[java]
disabled = true
[lua]
disabled = true
[docker_context]
disabled = true
[golang]
disabled = true
[haskell]
disabled = true
[php]
disabled = true
[ruby]
disabled = true
[terraform]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true
[kubernetes]
disabled = true
