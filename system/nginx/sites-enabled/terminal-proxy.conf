server {
    listen 172.18.0.1:8085;

    access_log /var/log/nginx/terminal.access.log;
    error_log  /var/log/nginx/terminal.error.log;

    # Restrict to the tunnel container's static IP (cryptex-cloudflared,
    # 172.18.0.4 in docker-compose.yml) + host loopback. This is the actual
    # fix for VPS-AUDIT-2026-08-14.md HIGH finding #1: any other container on
    # cryptex_net reaching this Docker-gateway listener directly (bypassing
    # Cloudflare Access entirely) previously got a full unauthenticated PTY
    # shell. A forged Cf-Access-Jwt-Assertion header alone does NOT stop this
    # (nginx doesn't strip client-supplied copies at this hop), so network
    # source restriction — not just header presence — is required here.
    allow 172.18.0.4;
    allow 127.0.0.1;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8085;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 75s;
        proxy_buffering off;
        proxy_socket_keepalive on;
    }
}
