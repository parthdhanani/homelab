limit_req_zone $binary_remote_addr zone=courselint_limit:10m rate=6r/m;

server {
    listen 172.18.0.1:5053;

    access_log /var/log/nginx/courselint.access.log;
    error_log  /var/log/nginx/courselint.error.log;

    client_max_body_size 60M;

    location / {
        proxy_pass http://127.0.0.1:5053;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_request_buffering off;
    }

    location = /score {
        limit_req zone=courselint_limit burst=3 nodelay;

        proxy_pass http://127.0.0.1:5053;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_request_buffering off;
    }
}
