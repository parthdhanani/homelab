server {
    listen 172.18.0.1:8086;

    access_log /var/log/nginx/sb-tool.access.log;
    error_log  /var/log/nginx/sb-tool.error.log;

    client_max_body_size 200M;

    location = /course {
        return 301 /course/;
    }

    location /course/ {
        alias /opt/cryptex/data/sb-course/;
        try_files $uri $uri/ =404;

        # course code stays uncacheable while under iteration; media keeps default caching
        set $course_nc "";
        if ($uri ~ \.(html|js|css|vtt)$) { set $course_nc "no-cache"; }
        add_header Cache-Control $course_nc;
    }

    location / {
        proxy_pass http://127.0.0.1:5050;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_request_buffering off;
    }
}
