server {
    listen 127.0.0.1:8083;
    listen 172.18.0.1:8083;

    access_log /var/log/nginx/zellij-proxy.access.log;
    error_log  /var/log/nginx/zellij-proxy.error.log;

    proxy_set_header Accept-Encoding "";

    location / {
        proxy_pass http://127.0.0.1:8082;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 75s;
        proxy_buffering off;
        proxy_socket_keepalive on;

        sub_filter '</head>' '
<style>
.xterm { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "Menlo", monospace !important; font-size: 14px !important; }
.xterm-selection div { background-color: rgba(255, 255, 255, 0.25) !important; }
.xterm-rows span { opacity: 1 !important; }
</style>
<script>
(function() {
  function setViewport() {
    var vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    var vw = (window.visualViewport ? window.visualViewport.width  : window.innerWidth);
    document.documentElement.style.setProperty("--dynamic-vh", vh + "px");
    document.documentElement.style.setProperty("--dynamic-vw", vw + "px");
    window.dispatchEvent(new Event("resize"));
  }
  setViewport();
  window.addEventListener("resize", setViewport);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", setViewport);
    window.visualViewport.addEventListener("scroll", setViewport);
  }
  window.addEventListener("load", function() { setTimeout(setViewport, 300); });
})();
</script></head>';
        sub_filter_once on;
    }
}
