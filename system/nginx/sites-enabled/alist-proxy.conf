server {
    listen 127.0.0.1:5245;
    listen 172.18.0.1:5245;

    access_log /var/log/nginx/alist-proxy.access.log;
    error_log  /var/log/nginx/alist-proxy.error.log;

    # Strip Accept-Encoding so Cloudflare cannot gzip the PROPFIND 207 response
    proxy_set_header Accept-Encoding "";

    location / {
        proxy_pass http://172.18.0.39:5244;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebDAV method passthrough
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";

        # Prevent Cloudflare from transforming WebDAV responses
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, no-transform" always;

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 75s;
    }
}
