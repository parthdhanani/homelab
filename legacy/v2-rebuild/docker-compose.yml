# CRYPTEX Rebuild — Production hardened, rolling latest images
# Deploy: cd /opt/cryptex && docker compose up -d
# Security: cap_drop ALL, no-new-privileges, memory limits, log rotation

networks:
  cryptex_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      tag: "cryptex/{{.Name}}"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# ─── INFRASTRUCTURE ─────────────────────────────────────────

services:
  # 1. PostgreSQL — Shared database (Moodle, n8n, Tianji, TRAX LRS, Forgejo)
  postgres:
    <<: *defaults
    image: postgres:16-alpine
    container_name: cryptex-postgres
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.2
    shm_size: 256m
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    volumes:
      - /opt/cryptex/data/postgres:/var/lib/postgresql/data
      - /opt/cryptex/configs/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MOODLE_DB_USER: ${MOODLE_DB_USER}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      TIANJI_DB_USER: ${TIANJI_DB_USER}
      TIANJI_DB_PASSWORD: ${TIANJI_DB_PASSWORD}
      TRAXLRS_DB_USER: ${TRAXLRS_DB_USER}
      TRAXLRS_DB_PASSWORD: ${TRAXLRS_DB_PASSWORD}
      FORGEJO_DB_USER: ${FORGEJO_DB_USER}
      FORGEJO_DB_PASSWORD: ${FORGEJO_DB_PASSWORD}
      MINIFLUX_DB_USER: ${MINIFLUX_DB_USER:-miniflux_user}
      MINIFLUX_DB_PASSWORD: ${MINIFLUX_DB_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    command: >
      postgres
        -c shared_buffers=256MB
        -c max_connections=60
        -c effective_cache_size=512MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c wal_buffers=16MB
        -c checkpoint_completion_target=0.9
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 1b. PgBouncer — Connection pooler (transaction mode, sits in front of postgres)
  # All app services connect here on port 5432 — NOT directly to postgres
  # userlist.txt is generated by deploy.sh from .env before containers start
  pgbouncer:
    <<: *defaults
    image: edoburu/pgbouncer:latest
    container_name: cryptex-pgbouncer
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.29
    cap_add: [CHOWN, SETUID, SETGID]
    volumes:
      - /opt/cryptex/configs/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - /opt/cryptex/configs/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis — Cache + queue (n8n queue, Moodle sessions)
  redis:
    <<: *defaults
    image: redis:alpine
    container_name: cryptex-redis
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.3
    cap_add: [CHOWN, SETUID, SETGID]
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    command: redis-server --maxmemory 200mb --maxmemory-policy volatile-lru --requirepass "${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Cloudflared — Cloudflare Tunnel (outbound only)
  cloudflared:
    <<: *defaults
    image: cloudflare/cloudflared:latest
    container_name: cryptex-cloudflared
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.4
    command: tunnel --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      # cloudflared is distroless — use built-in 'tunnel ready' subcommand (hits /ready endpoint)
      test: ["CMD", "/usr/local/bin/cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 4. Tailscale — Installed natively on VPS host (not in Docker)
  #    Install: curl -fsSL https://tailscale.com/install.sh | sh
  #    Setup:   sudo tailscale up --hostname=cryptex-vps --advertise-routes=172.18.0.0/16 --accept-dns=false

  # 5. Docker Socket Proxy — Filtered Docker API for Dozzle/DIUN
  socket-proxy:
    <<: *defaults
    image: tecnativa/docker-socket-proxy:latest
    container_name: cryptex-socket-proxy
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.28
    cap_add: [CHOWN, SETUID, SETGID]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      LOGS: 1
      EVENTS: 1
      VERSION: 1
      NETWORKS: 0
      VOLUMES: 0
      # POST enabled: n8n restarts containers + exec into workstation for Claude Code
      # Dozzle/DIUN only make GET requests — POST/EXEC don't affect them
      POST: 1
      EXEC: 1
      SYSTEM: 1    # required for GET /system/df (storage monitor workflow)
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── WEB SERVICES ──────────────────────────────────────────

  # 6. Portfolio — Static site (nginx)
  portfolio:
    <<: *defaults
    image: nginx:alpine
    container_name: cryptex-portfolio
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.10
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    volumes:
      - /opt/cryptex/configs/nginx/portfolio.conf:/etc/nginx/conf.d/portfolio.conf:ro
      - /opt/cryptex/configs/nginx/aquasoul.conf:/etc/nginx/conf.d/aquasoul.conf:ro
      - /opt/cryptex/data/portfolio:/usr/share/nginx/html:ro
      - /opt/cryptex/data/aquasoul:/srv/aquasoul:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    healthcheck:
      # Use 127.0.0.1 — read_only:true can break localhost DNS resolution in Alpine
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 7. Moodle — LMS (custom build from moodle.org source)
  # Update: change MOODLE_VERSION in dockerfiles/moodle.Dockerfile, rebuild
  moodle:
    <<: *defaults
    build:
      context: ./dockerfiles
      dockerfile: moodle.Dockerfile
    container_name: cryptex-moodle
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.7
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE, SYS_CHROOT]
    volumes:
      - /opt/cryptex/data/moodledata:/var/www/moodledata
      - /opt/cryptex/data/moodle-uploads:/moodle-uploads:ro
      - /opt/cryptex/data/moodle-plugins/theme:/var/www/html/theme
      - /opt/cryptex/data/moodle-plugins/format:/var/www/html/course/format
    environment:
      DB_HOST: cryptex-pgbouncer
      DB_NAME: moodle
      DB_USER: ${MOODLE_DB_USER}
      DB_PASSWORD: ${MOODLE_DB_PASSWORD}
      MOODLE_URL: https://learn.${DOMAIN}
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL}
      MOODLE_SITE_NAME: ${MOODLE_SITE_NAME}
      REDIS_HOST: cryptex-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_SECURITY: tls
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"
    healthcheck:
      # 303 redirects to external https://learn.DOMAIN — don't follow; accept 2xx/3xx
      test: ["CMD-SHELL", "curl -sSo /dev/null -w '%{http_code}' http://127.0.0.1:80/ | grep -qE '^[23]'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # 8. TRAX LRS — xAPI Learning Record Store
  traxlrs:
    <<: *defaults
    build:
      context: ./dockerfiles
      dockerfile: traxlrs.Dockerfile
    container_name: cryptex-traxlrs
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.13
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    volumes:
      - /opt/cryptex/data/traxlrs:/var/www/html/storage
    environment:
      APP_KEY: ${TRAXLRS_APP_KEY}
      APP_URL: https://lrs.${DOMAIN}
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: cryptex-pgbouncer
      DB_PORT: "5432"
      DB_DATABASE: traxlrs
      DB_USERNAME: ${TRAXLRS_DB_USER}
      DB_PASSWORD: ${TRAXLRS_DB_PASSWORD}
      ADMIN_EMAIL: ${TRAXLRS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${TRAXLRS_ADMIN_PASSWORD}
      DEFAULT_ENDPOINT_USERNAME: ${TRAXLRS_ENDPOINT_USERNAME:-traxlrs}
      DEFAULT_ENDPOINT_PASSWORD: ${TRAXLRS_ENDPOINT_PASSWORD}
    depends_on:
      pgbouncer:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      # --max-redirs 0 prevents following external redirect; -w checks status is 2xx or 3xx
      test: ["CMD-SHELL", "curl -sSo /dev/null -w '%{http_code}' http://127.0.0.1:80/ | grep -qE '^[23]'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 9. Vaultwarden — Password manager
  vaultwarden:
    <<: *defaults
    image: vaultwarden/server:alpine
    container_name: cryptex-vaultwarden
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.6
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    volumes:
      - /opt/cryptex/data/vaultwarden:/data
    environment:
      DOMAIN: https://vault.${DOMAIN}
      SIGNUPS_ALLOWED: "${VAULTWARDEN_SIGNUPS_ALLOWED:-false}"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      DATABASE_URL: /data/db.sqlite3
      WEBSOCKET_ENABLED: "true"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_SECURITY: starttls
      SMTP_FROM: ${SMTP_USER}
      SMTP_USERNAME: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 150M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:80/alive"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 10. n8n — Workflow automation (regular mode, single-user)
  # n8n-tools: init container that installs qpdf + pdftotext into a shared volume.
  # Runs once on deploy; n8n mounts /tools and adds it to PATH.
  # This lets n8n use the official image (auto-updatable) without a custom Dockerfile.
  n8n-tools:
    image: alpine:3.22
    container_name: cryptex-n8n-tools
    restart: "no"
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.35
    volumes:
      - n8n_tools:/tools
    command:
      - sh
      - -c
      - |
        if [ ! -f /tools/usr/bin/qpdf ]; then
          echo 'Installing qpdf + pdftotext...'
          apk add --no-cache qpdf poppler-utils
          mkdir -p /tools/usr/bin /tools/usr/lib
          cp /usr/bin/qpdf /usr/bin/pdftotext /tools/usr/bin/
          cp -aP /usr/lib/. /tools/usr/lib/
          echo 'Tools ready.'
        else
          echo 'Tools already installed, skipping.'
        fi
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "1"

  n8n:
    <<: *defaults
    image: n8nio/n8n:latest
    container_name: cryptex-n8n
    user: "1000:1000"
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.8
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    depends_on:
      n8n-tools:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /opt/cryptex/data/n8n:/home/node/.n8n
      - /opt/cryptex/configs/n8n-workflows:/opt/workflows:ro
      - /opt/cryptex/data/moodle-uploads:/moodle-uploads
      - n8n_tools:/tools:ro
    environment:
      PATH: /tools/usr/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      LD_LIBRARY_PATH: /tools/usr/lib
      N8N_HOST: n8n.${DOMAIN}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      GENERIC_TIMEZONE: UTC
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: cryptex-pgbouncer
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Telegram Bot (used by n8n workflows for alerts + commands)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Gemini API (used by n8n maintenance workflows for update intelligence)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Miniflux (used by morning digest workflow)
      MINIFLUX_ADMIN_USER: ${MINIFLUX_ADMIN_USER:-admin}
      MINIFLUX_ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD:-}
      MINIFLUX_URL: http://cryptex-miniflux:8080
      # Bank statement automation (IMAP trigger + PDF processing)
      BANK_EMAIL_DOMAIN: ${BANK_EMAIL_DOMAIN:-}
      BANK_PDF_PASSWORD: ${BANK_PDF_PASSWORD:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: 600M
          cpus: "1.0"
    healthcheck:
      # 127.0.0.1 — localhost DNS fails in Alpine/BusyBox containers with no resolv.conf
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 13. AdGuard Home — DNS filtering
  # Port 53 exposed to host for Tailscale DNS routing
  adguard:
    <<: *defaults
    image: adguard/adguardhome:latest
    container_name: cryptex-adguard
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.12
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - /opt/cryptex/data/adguard/work:/opt/adguardhome/work
      - /opt/cryptex/data/adguard/conf:/opt/adguardhome/conf
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    healthcheck:
      # Check DNS is serving on port 53 (reliable from first start, unlike HTTP UI which needs setup)
      test: ["CMD-SHELL", "nslookup -timeout=3 health.check 127.0.0.1 >/dev/null 2>&1 || wget -qO /dev/null http://127.0.0.1:80/ 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 14. Tianji — Monitoring, analytics, status page
  # Admin dashboard: monitor.psidex.com (Zero Trust protected)
  # Public status page: status.psidex.com (Zero Trust bypass)
  # Both point to this container — CF Zero Trust controls access
  # SMTP configured via Tianji web UI after deployment (Settings → Notification)
  tianji:
    <<: *defaults
    image: moonrailgun/tianji:latest
    container_name: cryptex-tianji
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.5
    cap_add: [CHOWN, SETUID, SETGID]
    environment:
      # Direct postgres connection — Prisma uses prepared statements which break PgBouncer transaction mode.
      # schema.prisma has no directUrl field so can't split migrate vs runtime. Direct is simpler.
      DATABASE_URL: postgresql://${TIANJI_DB_USER}:${TIANJI_DB_PASSWORD}@cryptex-postgres:5432/tianji
      JWT_SECRET: ${TIANJI_JWT_SECRET}
      ALLOW_REGISTER: "false"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:12345/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 15. Kopia — Backup server (local repository, initialized by deploy.sh)
  kopia:
    <<: *defaults
    image: kopia/kopia:latest
    container_name: cryptex-kopia
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.19
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    volumes:
      - /opt/cryptex/data/kopia/config:/app/config
      - /opt/cryptex/data/kopia/cache:/app/cache
      - /opt/cryptex/data/kopia/repository:/app/repository
      - /opt/cryptex/data:/data:ro
      - /opt/cryptex/backups:/backups:ro
    environment:
      KOPIA_CONFIG_PATH: /app/config/repository.config
      KOPIA_LOG_DIR: /app/config/logs
      KOPIA_CACHE_DIRECTORY: /app/cache
      KOPIA_PASSWORD: ${KOPIA_PASSWORD}
      KOPIA_SERVER_CONTROL_PASSWORD: ${KOPIA_SERVER_PASSWORD}
      KOPIA_SERVER_CONTROL_USERNAME: ${KOPIA_SERVER_USER}
    command: server start --insecure --address=0.0.0.0:51515 --server-control-username=${KOPIA_SERVER_USER} --server-control-password=${KOPIA_SERVER_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    healthcheck:
      # kopia image has no wget — use kopia CLI; 401 means server is up (just needs auth)
      test: ["CMD-SHELL", "kopia server status 2>&1 | grep -q '401' && exit 0; kopia server status 2>&1 | grep -q 'CONNECTED' && exit 0; exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── UTILITIES ──────────────────────────────────────────────

  # 16. DIUN — Docker Image Update Notifier (email alerts via Gmail)
  diun:
    <<: *defaults
    image: crazymax/diun:latest
    container_name: cryptex-diun
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.23
    volumes:
      - /opt/cryptex/configs/diun/diun.yml:/diun.yml:ro
      - diun_data:/data
    environment:
      CONFIG: /diun.yml
      TZ: UTC
      DIUN_WATCH_SCHEDULE: "0 6 * * *"
      DOCKER_HOST: tcp://cryptex-socket-proxy:2375
      # Email notifications via Gmail
      DIUN_NOTIF_MAIL_HOST: smtp.gmail.com
      DIUN_NOTIF_MAIL_PORT: "587"
      DIUN_NOTIF_MAIL_SSL: "false"
      DIUN_NOTIF_MAIL_USERNAME: ${SMTP_USER}
      DIUN_NOTIF_MAIL_PASSWORD: ${SMTP_PASSWORD}
      DIUN_NOTIF_MAIL_FROM: ${SMTP_USER}
      DIUN_NOTIF_MAIL_TO: ${SMTP_USER}
    depends_on:
      socket-proxy:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "pgrep diun || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 17. [REMOVED] HolyClaude replaced by Zellij host install
  # Zellij runs as a systemd service on the host (not a container)
  # Service: /etc/systemd/system/zellij-web.service → port 8082
  # Tools: Claude Code + Gemini CLI + yazi + zoxide + starship + fzf + ripgrep + bat + fd
  # Auth: Zellij token (run: zellij web --create-token)
  # Config: /home/ubuntu/.config/zellij/
  # Zellaude plugin: /home/ubuntu/.config/zellij/plugins/zellaude.wasm
  # Access: code.psidex.com → Cloudflare Tunnel → localhost:8082
  # Update Zellij: wget new binary from github.com/zellij-org/zellij/releases → replace /usr/local/bin/zellij → sudo systemctl restart zellij-web
  # Update Claude Code: sudo npm update -g @anthropic-ai/claude-code
  # Update Gemini CLI: sudo npm update -g @google/gemini-cli

  # 18. Dozzle — Container log viewer
  dozzle:
    <<: *defaults
    image: amir20/dozzle:latest
    container_name: cryptex-dozzle
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.24
    environment:
      DOCKER_HOST: tcp://cryptex-socket-proxy:2375
      DOZZLE_NO_ANALYTICS: "true"
    depends_on:
      socket-proxy:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    healthcheck:
      # dozzle has a built-in healthcheck subcommand — distroless (no wget/curl/sh)
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 19. Forgejo — Self-hosted Git (Codeberg fork, no GitHub dependency)
  forgejo:
    <<: *defaults
    image: codeberg.org/forgejo/forgejo:10
    container_name: cryptex-forgejo
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.31
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, NET_BIND_SERVICE]
    volumes:
      - /opt/cryptex/data/forgejo:/data
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: cryptex-postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: ${FORGEJO_DB_USER}
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD}
      FORGEJO__server__ROOT_URL: https://git.${DOMAIN}/
      FORGEJO__server__DOMAIN: git.${DOMAIN}
      FORGEJO__server__SSH_DOMAIN: git.${DOMAIN}
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "${FORGEJO_DISABLE_REGISTRATION:-false}"
      FORGEJO__mailer__ENABLED: "true"
      FORGEJO__mailer__PROTOCOL: smtp+starttls
      FORGEJO__mailer__SMTP_ADDR: smtp.gmail.com
      FORGEJO__mailer__SMTP_PORT: "587"
      FORGEJO__mailer__USER: ${SMTP_USER}
      FORGEJO__mailer__PASSWD: ${SMTP_PASSWORD}
      FORGEJO__mailer__FROM: ${SMTP_USER}
      FORGEJO__packages__ENABLED: "true"
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 20. Miniflux — RSS reader (reading UI + source for AI morning digest)
  # After deploy: add feeds via news.DOMAIN UI, then n8n digest runs automatically
  # Cleanup policy: read articles removed after 30d, unread after 60d (prevents Postgres bloat)
  miniflux:
    <<: *defaults
    image: miniflux/miniflux:latest
    container_name: cryptex-miniflux
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.14
    cap_add: [CHOWN, SETUID, SETGID]
    environment:
      DATABASE_URL: "postgres://${MINIFLUX_DB_USER:-miniflux_user}:${MINIFLUX_DB_PASSWORD}@cryptex-pgbouncer:5432/miniflux?sslmode=disable"
      RUN_MIGRATIONS: 1
      CREATE_ADMIN: 1
      ADMIN_USERNAME: ${MINIFLUX_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD}
      BASE_URL: https://news.${DOMAIN}
      CLEANUP_FREQUENCY_HOURS: 24
      CLEANUP_ARCHIVE_READ_DAYS: 30
      CLEANUP_ARCHIVE_UNREAD_DAYS: 60
      POLLING_FREQUENCY: 60
      POLLING_PARSING_ERROR_LIMIT: 3
      FETCH_YOUTUBE_WATCH_TIME: 0
    depends_on:
      pgbouncer:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 22. ActualBudget — Self-hosted budget tracker (bank statement import via n8n)
  # Access at budget.DOMAIN — set up one budget file after first login
  # user 1001 = actual (image-defined) — required because cap_drop:ALL removes CAP_DAC_OVERRIDE,
  # so root can't write to dirs it doesn't own; running as actual avoids that entirely
  actualbudget:
    <<: *defaults
    image: actualbudget/actual-server:latest
    container_name: cryptex-actualbudget
    user: "1001:1001"
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.17
    volumes:
      - /opt/cryptex/data/actualbudget:/data
    environment:
      ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB: 20
      ACTUAL_UPLOAD_SYNC_ENCRYPTION_KEY_SIZE: 16
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      # actualbudget has node but not wget — use node HTTP request
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5006/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── OpenWebUI — AI chat interface (Gemini, Claude via API) ──────────────────
  openwebui:
    <<: *defaults
    image: ghcr.io/open-webui/open-webui:latest
    container_name: cryptex-openwebui
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.30
    volumes:
      - /opt/cryptex/data/openwebui:/app/backend/data
    environment:
      WEBUI_NAME: "Cryptex AI"
      WEBUI_URL: https://chat.${DOMAIN}
      GOOGLE_API_KEY: ${GEMINI_API_KEY:-}
      DEFAULT_MODELS: gemini-2.0-flash-exp
      ENABLE_SIGNUP: "${OPENWEBUI_SIGNUP_ENABLED:-false}"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── SearXNG — Private self-hosted search engine ───────────────────────────
  searxng:
    <<: *defaults
    image: searxng/searxng:latest
    container_name: cryptex-searxng
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.32
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:false
    volumes:
      - /opt/cryptex/data/searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: https://search.${DOMAIN}
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY:-changeme}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── rclone — WebDAV file server (Finder + iOS Files mount) ──────────────
  rclone:
    <<: *defaults
    image: rclone/rclone:latest
    container_name: cryptex-rclone
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.34
    cap_add: [CHOWN, SETUID, SETGID]
    volumes:
      - /opt/cryptex/data/rclone/config:/config/rclone
      - /opt/cryptex/data/portfolio:/data/portfolio
      - /opt/cryptex/data/aquasoul:/data/aquasoul
      - /opt/cryptex/data/moodle-uploads:/data/moodle-uploads
      - /opt/cryptex/data/pkm:/data/pkm
    environment:
      RCLONE_CONFIG: /config/rclone/rclone.conf
    command: >
      serve webdav /data
      --addr 0.0.0.0:8080
      --user ${RCLONE_WEBDAV_USER}
      --pass ${RCLONE_WEBDAV_PASS}
      --read-only=false
      --no-checksum
      --vfs-cache-mode writes
      --vfs-write-back 5s
      --log-level INFO
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "rclone rc --url http://127.0.0.1:5572 core/version 2>/dev/null || wget -qO /dev/null --server-response http://127.0.0.1:8080/ 2>&1 | grep -q 'HTTP/'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Stirling PDF — Self-hosted PDF tools ─────────────────────────────────
  stirling-pdf:
    <<: *defaults
    image: frooodle/s-pdf:latest
    container_name: cryptex-stirling-pdf
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.33
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:false
    volumes:
      - /opt/cryptex/data/stirling-pdf/trainingData:/usr/share/tesseract-ocr/5/tessdata
      - /opt/cryptex/data/stirling-pdf/configs:/configs
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      SECURITY_ENABLE_LOGIN: "false"
      INSTALL_BOOK_AND_ADVANCED_HTML_OPS: "false"
      # Override hardcoded JVM flags — raise Metaspace from 96m to 256m to prevent OOM
      JAVA_TOOL_OPTIONS: >-
        -XX:+ExitOnOutOfMemoryError
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+UseStringDeduplication
        -XX:+ExplicitGCInvokesConcurrent
        -Dspring.threads.virtual.enabled=true
        -Djava.awt.headless=true
        -XX:InitialRAMPercentage=30
        -XX:MaxRAMPercentage=60
        -XX:MaxMetaspaceSize=256m
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.75"
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null -w '%{http_code}' http://127.0.0.1:8080/ | grep -qE '^[234]|401'"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s

  # ── IT-Tools — Developer utility collection ──────────────────────────────
  it-tools:
    <<: *defaults
    image: corentinth/it-tools:latest
    container_name: cryptex-it-tools
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.36
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Notes — Quartz static site (Obsidian vault → HTML, built on VPS via cron) ──
  # Quartz build runs every 15min via cron (see deploy.sh crontab block)
  # Output served as static HTML — ~5MB RAM, no Chromium, no GUI stack
  # Vault source: /opt/cryptex/data/pkm (also readable by Claude Code directly)
  # Rebuild manually: docker exec cryptex-quartz-builder npx quartz build
  notes:
    <<: *defaults
    image: nginx:alpine
    container_name: cryptex-notes
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.37
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    volumes:
      - /opt/cryptex/data/quartz-output:/usr/share/nginx/html:ro
      - /opt/cryptex/configs/nginx/notes.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.10"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/ 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Quartz builder — builds Obsidian vault → static HTML every 15min ──
  # Init-style: runs on demand via cron, stays idle otherwise
  # Vault mount: /vault (read-only source), /output (write HTML)
  quartz-builder:
    <<: *defaults
    image: node:22-alpine
    container_name: cryptex-quartz-builder
    restart: "no"
    networks:
      cryptex_net:
        ipv4_address: 172.18.0.38
    volumes:
      - /opt/cryptex/data/pkm:/vault:ro
      - /opt/cryptex/data/quartz-output:/output
      - /opt/cryptex/data/quartz-app:/app
    working_dir: /app
    command: >
      sh -c "
        if [ ! -f /app/package.json ]; then
          echo 'Quartz not installed — run deploy.sh to initialise';
          exit 0;
        fi
        echo 'Building Quartz...' &&
        node --no-deprecation /app/quartz/bootstrap-cli.mjs build --directory /vault --output /output/site &&
        echo 'Build complete'
      "
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  redis_data:
  diun_data:
  n8n_tools:
