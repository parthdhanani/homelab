#cloud-config
# CRYPTEX Rebuild - Production Hardened
# Ubuntu 22.04 ARM64 on Oracle Cloud Free Tier
# Security model: Zero open ports except SSH (22)
# All web traffic via Cloudflare Tunnel (outbound only)

package_update: true
package_upgrade: true

packages:
  - curl
  - git
  - htop
  - vim
  - net-tools
  - fail2ban
  - unattended-upgrades
  - apache2-utils
  - uuid-runtime
  - iptables-persistent
  - sqlite3
  - rclone

write_files:
  # ── Docker daemon config ──
  # iptables: false — Docker CANNOT open ports or modify firewall
  # We manage iptables manually via iptables-persistent
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "storage-driver": "overlay2",
        "no-new-privileges": true,
        "userland-proxy": false,
        "iptables": false,
        "live-restore": true
      }
    permissions: '0644'

  # ── iptables rules (IPv4) ──
  # Loaded by iptables-persistent on boot
  # Policy: DROP all inbound except SSH + ICMP
  # Docker networking: FORWARD + MASQUERADE for container subnets
  - path: /etc/iptables/rules.v4
    content: |
      *filter
      :INPUT DROP [0:0]
      :FORWARD DROP [0:0]
      :OUTPUT ACCEPT [0:0]
      # Established connections
      -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT
      # Loopback
      -A INPUT -i lo -j ACCEPT
      # SSH only
      -A INPUT -p tcp --dport 22 -j ACCEPT
      # ICMP (ping + MTU discovery)
      -A INPUT -p icmp --icmp-type echo-request -j ACCEPT
      -A INPUT -p icmp --icmp-type echo-reply -j ACCEPT
      -A INPUT -p icmp --icmp-type destination-unreachable -j ACCEPT
      # Docker bridge → host (container-initiated traffic)
      -A INPUT -s 172.17.0.0/16 -j ACCEPT
      -A INPUT -s 172.18.0.0/16 -j ACCEPT
      # Tailscale → Docker bridge (DNS routing to AdGuard at 172.18.0.12:53)
      -A INPUT -i tailscale0 -d 172.18.0.0/16 -j ACCEPT
      # Container forwarding (outbound to internet)
      -A FORWARD -s 172.17.0.0/16 -j ACCEPT
      -A FORWARD -s 172.18.0.0/16 -j ACCEPT
      # Tailscale → Docker (allows Tailscale devices to reach containers)
      -A FORWARD -i tailscale0 -d 172.18.0.0/16 -j ACCEPT
      # Container forwarding (return traffic)
      -A FORWARD -d 172.17.0.0/16 -m state --state ESTABLISHED,RELATED -j ACCEPT
      -A FORWARD -d 172.18.0.0/16 -m state --state ESTABLISHED,RELATED -j ACCEPT
      # Return traffic from Docker to Tailscale
      -A FORWARD -o tailscale0 -m state --state ESTABLISHED,RELATED -j ACCEPT
      COMMIT
      *nat
      :PREROUTING ACCEPT [0:0]
      :INPUT ACCEPT [0:0]
      :OUTPUT ACCEPT [0:0]
      :POSTROUTING ACCEPT [0:0]
      # Container outbound NAT (required because Docker iptables: false)
      -A POSTROUTING -s 172.17.0.0/16 ! -d 172.17.0.0/16 -j MASQUERADE
      -A POSTROUTING -s 172.18.0.0/16 ! -d 172.18.0.0/16 -j MASQUERADE
      COMMIT
    permissions: '0644'

  # ── iptables rules (IPv6) — block all ──
  - path: /etc/iptables/rules.v6
    content: |
      *filter
      :INPUT DROP [0:0]
      :FORWARD DROP [0:0]
      :OUTPUT ACCEPT [0:0]
      -A INPUT -i lo -j ACCEPT
      -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT
      COMMIT
    permissions: '0644'

  # ── Fail2ban config ──
  - path: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = 3600
      findtime = 600
      maxretry = 3

      [sshd]
      enabled = true
      port = 22
      logpath = /var/log/auth.log
      maxretry = 3
      bantime = 1h

      [recidive]
      enabled = true
      filter = recidive
      logpath = /var/log/fail2ban.log
      maxretry = 5
      bantime = 1w
      findtime = 1d
    permissions: '0644'

  # ── Kernel tuning ──
  - path: /etc/sysctl.d/99-cryptex.conf
    content: |
      net.ipv4.ip_forward=1
      net.ipv4.conf.all.accept_redirects=0
      net.ipv4.conf.all.send_redirects=0
      net.ipv4.conf.all.accept_source_route=0
      net.ipv4.icmp_echo_ignore_broadcasts=1
      net.ipv4.conf.all.log_martians=1
      net.ipv4.conf.default.log_martians=1
      net.ipv6.conf.all.disable_ipv6=1
      net.ipv6.conf.default.disable_ipv6=1
      # Disable bridge-nf-call-iptables so bridge-local (container-to-container)
      # traffic is NOT filtered by iptables FORWARD chain
      net.bridge.bridge-nf-call-iptables=0
      net.bridge.bridge-nf-call-ip6tables=0
      fs.inotify.max_user_watches=524288
      fs.inotify.max_user_instances=8192
    permissions: '0644'

  # ── Static DNS (immutable after setup) ──
  - path: /etc/resolv.conf.cryptex
    content: |
      nameserver 1.1.1.1
      nameserver 1.0.0.1
      nameserver 8.8.8.8
    permissions: '0644'

  # ── SSH Hardening (drop-in config — overrides sshd_config) ──
  - path: /etc/ssh/sshd_config.d/99-cryptex.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      UsePAM yes
      X11Forwarding no
      MaxAuthTries 3
      ClientAliveInterval 300
      ClientAliveCountMax 2
    permissions: '0644'

  # ── Logrotate for Cryptex logs ──
  - path: /etc/logrotate.d/cryptex
    content: |
      /var/log/cryptex-*.log {
        daily
        rotate 7
        compress
        delaycompress
        missingok
        notifempty
        create 0640 root root
      }
    permissions: '0644'

  # ── MOTD ──
  - path: /etc/motd
    content: |
      CRYPTEX VPS — Oracle ARM64 Free Tier
      Location: /opt/cryptex/
      Firewall: iptables (SSH only), OCI Security List
      Commands: cd /opt/cryptex && docker compose ps
    permissions: '0644'

runcmd:
  # ── System Prep ──
  - timedatectl set-timezone UTC

  # 4GB swap (for Moodle peak usage)
  - fallocate -l 4G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo "/swapfile none swap sw 0 0" >> /etc/fstab

  # Automatic security updates (reboot at 3 AM if needed)
  - echo 'APT::Periodic::Update-Package-Lists "1";' > /etc/apt/apt.conf.d/20auto-upgrades
  - echo 'APT::Periodic::Unattended-Upgrade "1";' >> /etc/apt/apt.conf.d/20auto-upgrades
  - echo 'APT::Periodic::Download-Upgradeable-Packages "1";' >> /etc/apt/apt.conf.d/20auto-upgrades
  - echo 'APT::Periodic::AutocleanInterval "7";' >> /etc/apt/apt.conf.d/20auto-upgrades
  - sed -i 's|//Unattended-Upgrade::Automatic-Reboot "false";|Unattended-Upgrade::Automatic-Reboot "true";|g' /etc/apt/apt.conf.d/50unattended-upgrades
  - sed -i 's|//Unattended-Upgrade::Automatic-Reboot-Time "02:00";|Unattended-Upgrade::Automatic-Reboot-Time "03:00";|g' /etc/apt/apt.conf.d/50unattended-upgrades

  # ── Firewall (iptables) ──
  # Pre-seed iptables-persistent to not prompt during install
  - echo iptables-persistent iptables-persistent/autosave_v4 boolean true | debconf-set-selections
  - echo iptables-persistent iptables-persistent/autosave_v6 boolean true | debconf-set-selections

  # Load iptables rules (written by write_files)
  - iptables-restore < /etc/iptables/rules.v4
  - ip6tables-restore < /etc/iptables/rules.v6

  # ── DNS (must happen before Docker install needs DNS) ──
  # Mask systemd-resolved (mask > disable — prevents accidental re-enable)
  - systemctl stop systemd-resolved
  - systemctl disable systemd-resolved
  - systemctl mask systemd-resolved

  # Replace resolv.conf with static file and make immutable
  - rm -f /etc/resolv.conf
  - cp /etc/resolv.conf.cryptex /etc/resolv.conf
  - chattr +i /etc/resolv.conf

  # Apply kernel tuning
  - sysctl --system

  # ── Docker Installation ──
  - curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
  - sh /tmp/get-docker.sh
  - rm /tmp/get-docker.sh

  # Docker Compose v2 plugin (installed via Docker's apt repo, set up by get-docker.sh)
  - apt-get update && apt-get install -y docker-compose-plugin

  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ubuntu

  # ── SSH Hardening (drop-in config loaded from /etc/ssh/sshd_config.d/) ──
  - systemctl restart sshd

  - systemctl enable fail2ban
  - systemctl start fail2ban

  # ── Directory Structure ──
  - mkdir -p /opt/cryptex/{configs,scripts,dockerfiles,data,backups}
  - mkdir -p /opt/cryptex/data/{postgres,moodle,moodledata,moodle-uploads,vaultwarden,n8n,adguard/work,adguard/conf,tianji,kopia,traxlrs,workstation/vault,tailscale,portfolio,forgejo,aquasoul,miniflux,actualbudget}
  - chown -R ubuntu:ubuntu /opt/cryptex
  - chmod -R 750 /opt/cryptex
  - chmod -R 700 /opt/cryptex/data

  # ── Time sync ──
  - systemctl enable systemd-timesyncd
  - systemctl start systemd-timesyncd

  # ── Verification ──
  - docker run --rm hello-world > /var/log/docker-test.log 2>&1 || echo "DOCKER TEST FAILED" >> /var/log/cryptex-init.log
  - systemctl is-active fail2ban >> /var/log/cryptex-init.log 2>&1
  - iptables -L -n >> /var/log/cryptex-init.log 2>&1
  - echo "Cloud-init completed at $(date)" >> /var/log/cryptex-init.log

  # Cleanup
  - apt-get clean
  - rm -rf /var/lib/apt/lists/*

# Reboot after cloud-init
power_state:
  mode: reboot
  delay: now
  message: "Rebooting after CRYPTEX initialization"
  condition: True

final_message: "CRYPTEX cloud-init complete. System rebooting."
