# PgBouncer — Transaction-mode connection pooler for CRYPTEX
# Sits between all app services and PostgreSQL (cryptex-postgres:5432)
# Generated from this file — do not add passwords here; they go in userlist.txt
#
# Mode: transaction  — best for all services in this stack (short queries, no SET/LISTEN)
# Exception: Miniflux uses LISTEN — but Miniflux uses its own polling, no LISTEN in practice

[databases]
# Each app DB routed to postgres with its own user (pool is per user+database pair)
# Note: tianji connects directly to postgres (Prisma uses prepared statements, incompatible with transaction mode)
moodle    = host=cryptex-postgres port=5432 dbname=moodle
n8n       = host=cryptex-postgres port=5432 dbname=n8n
traxlrs   = host=cryptex-postgres port=5432 dbname=traxlrs
forgejo   = host=cryptex-postgres port=5432 dbname=forgejo
miniflux  = host=cryptex-postgres port=5432 dbname=miniflux

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# Transaction pooling — connections returned to pool after each transaction
pool_mode = transaction

# Ignore client startup parameters that PgBouncer doesn't forward to postgres.
# Go/Rust drivers (Miniflux, Forgejo) send extra_float_digits on connect;
# without this, they get "unsupported startup parameter" errors.
ignore_startup_parameters = extra_float_digits,options,statement_timeout

# Pool sizes: 5 connections per DB to postgres (5 DBs × 5 = 25 max server connections)
# tianji goes direct to postgres (Prisma prepared statements); max_connections stays 60
# Services see up to 20 client connections each (generous — they share)
default_pool_size = 5
max_client_conn = 120
reserve_pool_size = 2
reserve_pool_timeout = 5

# Connection hygiene
server_idle_timeout = 600
client_idle_timeout = 0
server_lifetime = 3600

# Logging (errors only in production)
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

# Admin interface (internal only)
admin_users = pgbouncer_admin
stats_users = pgbouncer_admin
