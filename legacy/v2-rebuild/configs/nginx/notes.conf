server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/site;
    index index.html;

    # Quartz generates hashed asset filenames — long cache is safe
    location ~* \.(css|js|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing — Quartz uses client-side navigation
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location ~ /\. {
        deny all;
    }
}
